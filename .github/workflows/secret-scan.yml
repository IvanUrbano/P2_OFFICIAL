name: Secret Scan

# Backstop for the pre-commit hook (which can be skipped with --no-verify or
# missing if `npm install` was never run). Runs on every branch so a leak is
# flagged right after the push, before it reaches main.
on:
  push:
  pull_request:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan tracked files for secrets
        run: node scripts/check-secrets.js --all
