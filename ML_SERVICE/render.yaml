services:
  - type: web
    name: tb-system-ml
    env: python
    plan: free
    rootDir: ML_SERVICE
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: 8001
