services:
  # ==================== TBInsight Backend ====================
  - type: web
    name: p2-official
    env: node
    plan: free
    rootDir: BACKEND
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set manually in Render Dashboard → Environment:
        # postgresql://neondb_owner:...@ep-xxx.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        sync: false
        # Set manually — must match Pasig Clone's JWT_SECRET (one login works in both apps)
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOGIN_LIMIT_WINDOW_MINS
        value: 15
      - key: LOGIN_LIMIT_MAX
        value: 5
      - key: FRONTEND_URL
        value: https://p2-official.vercel.app
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
        # Set manually — must match Pasig Clone's WEBHOOK_SECRET
      - key: ML_API_KEY
        sync: false
        # Set manually — must match ML Service's ML_API_KEY
      - key: ML_SERVICE_URL
        value: https://tb-system-ml.onrender.com
        sync: false

  # ==================== Pasig Clone Backend ====================
  - type: web
    name: pasig-clone-backend
    env: node
    plan: free
    rootDir: PASIG_CLONE/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set manually in Render Dashboard → Environment:
        # postgresql://neondb_owner:...@ep-xxx.neon.tech/pasig_clone_db?sslmode=require
      - key: AUTH_DATABASE_URL
        sync: false
        # Set manually — same value as p2-official's DATABASE_URL (shared users table)
      - key: JWT_SECRET
        sync: false
        # Set manually — must match p2-official's JWT_SECRET (one login works in both apps)
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEBHOOK_SECRET
        sync: false
        # Set manually — must match TBInsight's WEBHOOK_SECRET
      - key: TBINSIGHT_WEBHOOK_URL
        value: https://p2-official.onrender.com/api/webhook/pasig-clone
      - key: FRONTEND_URL
        value: https://pasig-clone-frontend.onrender.com
        sync: false

  # ==================== Pasig Clone Frontend ====================
  - type: web
    name: pasig-clone-frontend
    env: node
    plan: free
    rootDir: PASIG_CLONE/frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://pasig-clone-backend.onrender.com
        sync: false

  # ==================== TBInsight ML Service ====================
  - type: web
    name: tb-system-ml
    env: python
    plan: free
    rootDir: ML_SERVICE
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
        # Same Python the pinned requirements.txt versions were verified with
      - key: ML_API_KEY
        sync: false
        # Set manually — must match TBInsight backend's ML_API_KEY

databases: []
  # Render free Postgres was auto-deleted.
  # TBInsight DATABASE_URL is set manually in Render Dashboard → Environment.
  # Pasig Clone DATABASE_URL is set manually (separate Neon database: pasig_clone_db).
