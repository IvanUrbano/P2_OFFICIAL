services:
  # ==================== TBInsight Backend ====================
  - type: web
    name: p2-official
    env: node
    plan: free
    rootDir: BACKEND
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set manually in Render Dashboard → Environment:
        # postgresql://neondb_owner:...@ep-xxx.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        sync: false
        # Set manually — must match Pasig Clone's JWT_SECRET (one login works in both apps)
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOGIN_LIMIT_WINDOW_MINS
        value: 15
      - key: LOGIN_LIMIT_MAX
        value: 5
      - key: FRONTEND_URL
        value: https://p2-official.vercel.app
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
        # Set manually — must match Pasig Clone's WEBHOOK_SECRET
      - key: ML_API_KEY
        sync: false
        # Set manually — must match ML Service's ML_API_KEY
      - key: ML_SERVICE_URL
        sync: false
        # Set manually — the ML service Lambda Function URL (https://....lambda-url.us-west-2.on.aws)

  # ==================== Pasig Clone Backend ====================
  - type: web
    name: pasig-clone-backend
    env: node
    plan: free
    rootDir: PASIG_CLONE/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set manually in Render Dashboard → Environment:
        # postgresql://neondb_owner:...@ep-xxx.neon.tech/pasig_clone_db?sslmode=require
      - key: AUTH_DATABASE_URL
        sync: false
        # Set manually — same value as p2-official's DATABASE_URL (shared users table)
      - key: JWT_SECRET
        sync: false
        # Set manually — must match p2-official's JWT_SECRET (one login works in both apps)
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEBHOOK_SECRET
        sync: false
        # Set manually — must match TBInsight's WEBHOOK_SECRET
      - key: TBINSIGHT_WEBHOOK_URL
        value: https://p2-official.onrender.com/api/webhook/pasig-clone
      - key: FRONTEND_URL
        value: https://pasig-clone.vercel.app
        sync: false
        # Pasig Clone frontend is on Vercel (PASIG_CLONE/frontend/vercel.json proxies /api here)

  # ==================== TBInsight ML Service ====================
  # Not on Render: deployed to AWS Lambda from ML_SERVICE/Dockerfile (.github/workflows/deploy-ml-lambda.yml).

databases: []
  # Render free Postgres was auto-deleted.
  # TBInsight DATABASE_URL is set manually in Render Dashboard → Environment.
  # Pasig Clone DATABASE_URL is set manually (separate Neon database: pasig_clone_db).
