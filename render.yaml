services:
  - type: web
    name: tb-system-backend
    env: node
    plan: free
    rootDir: BACKEND
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set manually in Render Dashboard → Environment:
        # postgresql://neondb_owner:...@ep-xxx.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOGIN_LIMIT_WINDOW_MINS
        value: 15
      - key: LOGIN_LIMIT_MAX
        value: 5
      - key: FRONTEND_URL
        value: https://p2-official.vercel.app
        sync: false

databases: []
  # Render free Postgres was auto-deleted.
  # DATABASE_URL is set manually in Render Dashboard → Environment.
  # To recreate: uncomment below and remove the DATABASE_URL env var override.
  # - name: tb-system-db
  #   databaseName: tb_system
  #   user: tb_system_user
  #   plan: free
