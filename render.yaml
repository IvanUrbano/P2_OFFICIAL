services:
  # ==================== TBInsight Backend ====================
  - type: web
    name: tb-system-backend
    env: node
    plan: free
    rootDir: BACKEND
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set manually in Render Dashboard → Environment:
        # postgresql://neondb_owner:...@ep-xxx.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOGIN_LIMIT_WINDOW_MINS
        value: 15
      - key: LOGIN_LIMIT_MAX
        value: 5
      - key: FRONTEND_URL
        value: https://p2-official.vercel.app
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
        # Set manually — must match Pasig Clone's WEBHOOK_SECRET

  # ==================== Pasig Clone Backend ====================
  - type: web
    name: pasig-clone-backend
    env: node
    plan: free
    rootDir: PASIG_CLONE/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Set manually in Render Dashboard → Environment:
        # postgresql://neondb_owner:...@ep-xxx.neon.tech/pasig_clone_db?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEBHOOK_SECRET
        sync: false
        # Set manually — must match TBInsight's WEBHOOK_SECRET
      - key: TBINSIGHT_WEBHOOK_URL
        value: https://tb-system-backend.onrender.com/api/webhook/pasig-clone
      - key: FRONTEND_URL
        value: https://pasig-clone-frontend.onrender.app
        sync: false

  # ==================== Pasig Clone Frontend ====================
  - type: web
    name: pasig-clone-frontend
    env: node
    plan: free
    rootDir: PASIG_CLONE/frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0
    envVars:
      - key: VITE_API_URL
        value: https://pasig-clone-backend.onrender.app
        sync: false

databases: []
  # Render free Postgres was auto-deleted.
  # TBInsight DATABASE_URL is set manually in Render Dashboard → Environment.
  # Pasig Clone DATABASE_URL is set manually (separate Neon database: pasig_clone_db).
